name: Backend CI/CD

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
  IMAGE_NAME: eschool-backend

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=eschool-backend-final-project \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -DskipTests

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: target/sonar/report-task.txt  
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: "Example show SonarQube Quality Gate Status value"
        run: echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"
            
      - name: Get SonarQube Report (New Code + Overall)
        id: sonar-report
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          # Запит для New Code
          NEW_CODE=$(curl -s -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/measures/component?component=eschool-backend-final-project&metricKeys=bugs,vulnerabilities,code_smells,coverage&additionalFields=period")
          
          # Запит для Overall Code
          OVERALL=$(curl -s -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/measures/component?component=eschool-backend-final-project&metricKeys=bugs,vulnerabilities,code_smells,coverage,lines,ncloc")
      
          echo "new_code<<EOF" >> $GITHUB_OUTPUT
          echo "$NEW_CODE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
          echo "overall<<EOF" >> $GITHUB_OUTPUT
          echo "$OVERALL" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Post SonarQube results to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const qualityGateStatus = '${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}';
            
            try {
              const newCode = JSON.parse(`${{ steps.sonar-report.outputs.new_code }}`);
              const overall = JSON.parse(`${{ steps.sonar-report.outputs.overall }}`);
              
              console.log('New Code:', JSON.stringify(newCode).substring(0, 200));
              console.log('Overall:', JSON.stringify(overall).substring(0, 200));

              if (newCode.errors) {
                console.error('New Code API Error:', newCode.errors);
                throw new Error('New Code API error');
              }
              
              const newCodeMetrics = {};
              if (newCode.component && newCode.component.measures) {
                newCode.component.measures.forEach(m => {
                  if (m.periods && m.periods.length > 0) {
                    newCodeMetrics[m.metric] = m.periods[0].value || '0';
                  } else {
                    newCodeMetrics[m.metric] = m.value || '0';
                  }
                });
              }
              
              const overallMetrics = {};
              if (overall.component && overall.component.measures) {
                overall.component.measures.forEach(m => {
                  overallMetrics[m.metric] = m.value || '0';
                });
              }
              
              const body = `**SonarQube Analysis Results**
            
              **New Code (PR Changes):**
              Bugs: ${newCodeMetrics.bugs || '0'}
              Vulnerabilities: ${newCodeMetrics.vulnerabilities || '0'}
              Code Smells: ${newCodeMetrics.code_smells || '0'}
              Coverage: ${newCodeMetrics.coverage || 'N/A'}%
              
              **Overall Code (Full Project):**
              Bugs: ${overallMetrics.bugs || '0'}
              Vulnerabilities: ${overallMetrics.vulnerabilities || '0'}
              Code Smells: ${overallMetrics.code_smells || '0'}
              Coverage: ${overallMetrics.coverage || 'N/A'}%
              Lines of Code: ${overallMetrics.ncloc || '0'}
              
              Quality Gate: **${qualityGateStatus}**
              
              [View Full Report](${{ secrets.SONAR_HOST_URL }}/dashboard)`;
                      
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              } catch (error) {
                console.error('Error parsing SonarQube data:', error);
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `Quality Gate: **${qualityGateStatus}**\n\n[View Full Report](${{ secrets.SONAR_HOST_URL }}/dashboard)`
                });
              }
                  
